[project]
name = "interview-quiz-app"
version = "0.1.0"
description = "Card-based interview quiz engine: FastAPI backend, TypeScript frontend, level-gated question sets."
requires-python = ">=3.11"
# Vercel's Python builder resolves dependencies from this [project] table via uv,
# not from requirements.txt, whenever pyproject.toml is present — keep these two
# lists in sync (requirements.txt is what local `pip install -r` uses).
dependencies = [
    "fastapi==0.116.1",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "psycopg[binary]==3.2.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests", "api"]

[tool.ruff.lint]
# A practical "best practices" selection:
# E/W (pycodestyle), F (pyflakes), I (import sorting), B (bugbear: likely bugs),
# UP (modernize syntax), SIM (simplifications), ANN (type annotations on public code)
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]
ignore = [
    "ANN401", # dynamically typed *args/**kwargs are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"] # test functions don't need annotations

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom uses Depends() in defaults by design.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
# Pydantic and SQLAlchemy both ship inline types; no plugins required for our usage.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
